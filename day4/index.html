<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes Draft - Day 4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="header">
        <h1>QuickNotes</h1>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>

      <label for="note-text">Note</label>
      <textarea id="note-text" placeholder="Write your note here..."></textarea>

      <div class="stats">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <button id="clear-btn" type="button">Clear</button>
    </main>
  </body>
</html>
